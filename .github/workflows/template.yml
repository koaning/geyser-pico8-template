name: Template

# Renders the template into a fresh game and runs its toolchain, so a broken
# template fails here and not in a game.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit zip love xvfb
          pipx install copier

      - name: Render a game
        run: |
          copier copy --defaults --trust --vcs-ref HEAD \
            -d game=demo -d "title=Gem Grid" . /tmp/demo

      - name: make test
        working-directory: /tmp/demo
        run: make test

      - name: make site
        working-directory: /tmp/demo
        run: |
          make fetch-lovejs
          make site
          test -f dist/site/demo-p8.love
          grep -q 'player.js?g=demo-p8.love' dist/site/index.html

      - name: make screenshots
        working-directory: /tmp/demo
        run: |
          make screenshots LOVE="xvfb-run -a love"
          test -f docs/screenshots/pico8.png
          grep -q '^__label__$' pico8/demo.p8
          make test
